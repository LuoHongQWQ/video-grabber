<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>访问验证 · 无痕视频下载</title>
<style>
  :root {
    --cyan: #22d3ee;
    --indigo: #6366f1;
    --text: #edf1fb;
    --muted: #8d95ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(900px 600px at 10% -10%, rgba(34, 211, 238, 0.14), transparent 60%),
      radial-gradient(800px 600px at 95% 15%, rgba(99, 102, 241, 0.2), transparent 60%),
      #06080f;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 40%, #000 10%, transparent 72%);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: min(400px, 100%);
    padding: 36px 32px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 24px;
    background: rgba(15, 21, 38, 0.78);
    backdrop-filter: blur(22px);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
  }
  .logo {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--cyan), var(--indigo));
    margin-bottom: 22px;
    box-shadow: 0 12px 28px rgba(34, 211, 238, 0.25);
  }
  .logo svg { width: 22px; height: 22px; }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.3px; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    background: rgba(5, 8, 16, 0.7);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field:focus-within { border-color: rgba(34, 211, 238, 0.55); box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.08); }
  .field svg { width: 17px; height: 17px; color: #6b7488; flex-shrink: 0; }
  input {
    flex: 1;
    min-width: 0;
    height: 46px;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  input::placeholder { color: #5f6980; }
  button {
    width: 100%;
    height: 46px;
    margin-top: 16px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(100deg, #22d3ee, #6366f1);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.2s;
    box-shadow: 0 12px 30px rgba(34, 211, 238, 0.22);
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .err {
    display: none;
    margin: 14px 0 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(251, 113, 133, 0.35);
    background: rgba(251, 113, 133, 0.08);
    color: #fda4af;
    font-size: 13px;
  }
  .err.show { display: block; }
  .hint { margin: 18px 0 0; font-size: 11.5px; color: #66708a; line-height: 1.6; text-align: center; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5L8 5.5z" fill="#fff"/></svg>
  </div>
  <h1>访问验证</h1>
  <p class="sub">该站点已开启访问保护，请输入访问密码后进入。</p>
  <form id="loginForm" autocomplete="off">
    <label for="password">访问密码</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      </svg>
      <input id="password" type="password" placeholder="请输入访问密码" autofocus />
    </div>
    <button type="submit" id="submitBtn">进入站点</button>
  </form>
  <p class="err" id="errBox"></p>
  <p class="hint">密码可在 config.json 的 auth.password 中修改</p>
</div>

<script>
  const form = document.getElementById("loginForm");
  const errBox = document.getElementById("errBox");
  const btn = document.getElementById("submitBtn");

  fetch("/api/health")
    .then((res) => {
      if (res.ok) window.location.replace("/");
    })
    .catch(() => {});

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("password").value.trim();
    errBox.classList.remove("show");
    if (!password) {
      errBox.textContent = "请输入访问密码";
      errBox.classList.add("show");
      return;
    }
    btn.disabled = true;
    btn.textContent = "验证中…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.replace("/");
        return;
      }
      const data = await res.json().catch(() => null);
      errBox.textContent = (data && data.detail) || "密码错误，请重试";
      errBox.classList.add("show");
    } catch {
      errBox.textContent = "无法连接服务，请确认服务已启动";
      errBox.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "进入站点";
    }
  });
</script>
</body>
</html>
